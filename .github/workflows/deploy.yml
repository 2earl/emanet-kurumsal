name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

# Never run two deploys at once; never cancel one that has started.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Secrets live only in this environment: deploys from main only, each run approved by the owner.
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Until emanet-core's infra/ has created the database and its ID is in wrangler.jsonc.
      - name: Check the database ID is set
        run: |
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the placeholder D1 database ID (2earl/emanet-core infra/README.md)"
            exit 1
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test before deploying
        run: pnpm test

      # The app's own keys are made here, once, and never leave Cloudflare: nobody types or sees
      # them. A key that exists is never replaced: a new SESSION_PEPPER would invalidate every API
      # key, a new WEBHOOK_KEY every webhook secret. Rotating one is a deliberate, manual step.
      - name: Make the secrets this Worker doesn't have yet
        id: secrets
        run: |
          set -euo pipefail
          if ! list=$(pnpm exec wrangler secret list --format json 2>&1); then
            if echo "$list" | grep -qi 'not found\|does not exist\|10007'; then
              list='[]'
            else
              echo "::error::Could not list the Worker's secrets; not creating any."
              exit 1
            fi
          fi
          file="$RUNNER_TEMP/new-secrets.json"
          umask 077
          echo '{}' > "$file"
          for name in SESSION_PEPPER WEBHOOK_KEY; do
            if echo "$list" | grep -q "\"$name\""; then
              echo "$name exists"
            else
              value=$(openssl rand -base64 32)
              jq --arg k "$name" --arg v "$value" '. + {($k): $v}' "$file" > "$file.tmp"
              mv "$file.tmp" "$file"
              echo "$name will be created"
            fi
          done
          # Cloudflare Turnstile for the invitation request form (src/captcha.ts): one widget for
          # kurumsal.emanet.dev, made (or its secret renewed) with this token. The token needs the
          # "Turnstile Sites Write" permission. Without it the deploy goes on, the form stays
          # closed (it fails closed), and this warns until the permission is there.
          if echo "$list" | grep -q '"TURNSTILE_SECRET"' && echo "$list" | grep -q '"TURNSTILE_SITE_KEY"'; then
            echo "Turnstile keys exist"
          else
            account=$(grep -o '"account_id": "[0-9a-f]*"' wrangler.jsonc | grep -o '[0-9a-f]\{32\}')
            api="https://api.cloudflare.com/client/v4/accounts/$account/challenges/widgets"
            auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            widgets=$(curl -sS -H "$auth" "$api?per_page=100" || echo '{}')
            if [ "$(echo "$widgets" | jq -r '.success // false')" != "true" ]; then
              echo "::warning::Turnstile keys not made: the Cloudflare API token can't manage Turnstile (give it Turnstile Sites Write). The invitation request form stays closed."
              echo "### Turnstile not set up" >> "$GITHUB_STEP_SUMMARY"
              echo "Give this repository's CLOUDFLARE_API_TOKEN the permission **Turnstile Sites Write**, then re-run this deploy. Until then the invitation request form is closed." >> "$GITHUB_STEP_SUMMARY"
            else
              sitekey=$(echo "$widgets" | jq -r '[(.result // [])[] | select(.name == "emanet-kurumsal")][0].sitekey // empty')
              if [ -n "$sitekey" ]; then
                made=$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
                  --data '{"invalidate_immediately":true}' "$api/$sitekey/rotate_secret")
              else
                made=$(curl -sS -X POST -H "$auth" -H 'Content-Type: application/json' \
                  --data '{"name":"emanet-kurumsal","domains":["kurumsal.emanet.dev"],"mode":"managed","region":"world"}' "$api")
              fi
              site=$(echo "$made" | jq -r '.result.sitekey // empty')
              site=${site:-$sitekey}
              secret=$(echo "$made" | jq -r '.result.secret // empty')
              if [ -z "$site" ] || [ -z "$secret" ]; then
                echo "::warning::Turnstile answered without keys; the invitation request form stays closed."
              else
                echo "::add-mask::$secret"
                jq --arg s "$site" --arg k "$secret" '. + {TURNSTILE_SITE_KEY: $s, TURNSTILE_SECRET: $k}' "$file" > "$file.tmp"
                mv "$file.tmp" "$file"
                echo "Turnstile keys will be created"
              fi
            fi
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Migrations run before the new code, so the code can rely on the schema. They must stay
      # backward compatible with the code currently live (add, never rename or drop in one step).
      - name: Apply D1 migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote

      # New secrets go up with the version; existing ones are kept (--secrets-file is additive).
      - name: Deploy Worker
        env:
          SECRETS_FILE: ${{ steps.secrets.outputs.file }}
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy --secrets-file "$SECRETS_FILE"
          rm -f "$SECRETS_FILE"

      # Up to five minutes, so a first deployment can attach its custom domain meanwhile (core
      # infra/). GitHub's runners are datacenter addresses that Cloudflare sometimes challenges
      # (403 with cf-mitigated): that says nothing about the app, so it ends the check at once.
      - name: Smoke test
        env:
          URL: https://kurumsal.emanet.dev/oauth/client.json
          EXPECT: '"client_name":"Emanet Kurumsal"'
        run: |
          set -uo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o "$RUNNER_TEMP/body" -D "$RUNNER_TEMP/headers" -w '%{http_code}' --max-time 10 "$URL" || true)
            if [ "$code" = 200 ] && grep -q "$EXPECT" "$RUNNER_TEMP/body"; then
              echo "healthy"; exit 0
            fi
            if grep -qi '^cf-mitigated:' "$RUNNER_TEMP/headers" 2>/dev/null; then
              echo "::warning::Cloudflare challenged the runner (HTTP $code), so $URL couldn't be checked from here. Open it in a browser."
              exit 0
            fi
            echo "attempt $i: HTTP $code"
            sleep 10
          done
          echo "::warning::$URL is not answering yet: is its custom domain attached (2earl/emanet-core infra/worker.tf)?"
